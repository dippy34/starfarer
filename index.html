<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- the page is the app: it fills the screen under the notch and the home bar, and never zooms -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A real-scale universe to explore: 2.75 million real stars, every planet and moon, black holes, galaxies." />
    <!--
      The link's preview in a chat or a post (Open Graph, and X's card). A preview is fetched without
      the part after '#', so every shared scene shows this one. %SITE_URL% is put in by vite.config.ts:
      og:image and og:url must be absolute. The picture is the app's own, captured from it
      (scripts/og-image.mjs), 1200 x 630.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Starfarer" />
    <meta property="og:title" content="Starfarer: the real universe, to scale" />
    <meta property="og:description" content="Every planet and moon where they really are, 2.75 million real stars, black holes and galaxies. Change a world and watch real gravity take over." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Saturn and its rings, lit by the Sun, as Starfarer draws them" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Starfarer: the real universe, to scale" />
    <meta name="twitter:description" content="Every planet and moon where they really are, 2.75 million real stars, black holes and galaxies. Change a world and watch real gravity take over." />
    <meta name="twitter:image" content="%SITE_URL%og-image.png" />
    <meta name="twitter:image:alt" content="Saturn and its rings, lit by the Sun, as Starfarer draws them" />
    <!-- added to a phone's home screen it opens like an app, without the browser around it -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starfarer" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Starfarer</title>
    <!--
      The loading screen: styled here, not in the stylesheet, so that it is on the screen with the
      first bytes of the page. src/ui/Splash.ts fills it in from the real loading.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      #boot {
        position: fixed; inset: 0; z-index: 100; box-sizing: border-box;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: radial-gradient(120% 70% at 50% 26%, #101b38 0%, #04070f 60%, #000 100%);
        color: #dfe7f8; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        transition: opacity 0.6s ease;
      }
      #boot.ready { pointer-events: none; }
      #boot.done { opacity: 0; }
      .boot-box { width: min(100%, 344px); display: flex; flex-direction: column; align-items: center; }
      .boot-mark { width: 92px; height: 92px; border-radius: 21px; box-shadow: 0 12px 44px rgba(64, 124, 255, 0.28), 0 0 0 1px rgba(170, 205, 255, 0.12); }
      .boot-moon { transform-origin: 256px 262px; animation: boot-orbit 9s linear infinite; }
      .boot-title { margin-top: 18px; font-size: 20px; font-weight: 300; letter-spacing: 0.34em; text-indent: 0.34em; color: #fff; }
      .boot-meter { margin-top: 30px; width: 100%; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      .boot-meter i { display: block; width: 100%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #4f8de6, #cfe6ff); transform: scaleX(0); transform-origin: 0 50%; transition: transform 0.35s ease-out; }
      .boot-row { width: 100%; margin-top: 9px; display: flex; justify-content: space-between; font-size: 12px; color: #8494b3; font-variant-numeric: tabular-nums; }
      .boot-log { list-style: none; margin: 20px 0 0; padding: 0; width: 100%; height: 232px; overflow: hidden; font-size: 13px; }
      .boot-log li { display: grid; grid-template-columns: 14px 1fr; column-gap: 9px; max-height: 44px; padding-bottom: 7px; overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease; }
      .boot-log li.old { max-height: 0; padding-bottom: 0; opacity: 0; }
      .boot-log li i { width: 6px; height: 6px; margin-top: 6px; justify-self: center; border-radius: 50%; background: #7fb2ff; animation: boot-pulse 1.1s ease-in-out infinite; }
      .boot-log li[data-state="done"] i { width: 8px; height: 4px; margin-top: 5px; border-radius: 0; background: none; border-left: 1.6px solid #63cf9c; border-bottom: 1.6px solid #63cf9c; transform: rotate(-45deg); animation: none; }
      .boot-log li[data-state="failed"] i { background: #ff7a7a; animation: none; }
      .boot-log p { margin: 0; min-width: 0; }
      .boot-log b { font-weight: 500; color: #eef3ff; }
      .boot-log li[data-state="done"] b { font-weight: 400; color: #aebbd6; }
      .boot-log span { color: #7888a8; }
      .boot-log span:not(:empty)::before { content: " · "; }
      .boot-error { width: 100%; margin-top: 4px; padding: 14px 16px; box-sizing: border-box; border-radius: 14px; border: 1px solid rgba(255, 122, 122, 0.35); background: rgba(60, 14, 18, 0.55); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
      .boot-error b { color: #ffd7d7; font-weight: 600; }
      .boot-error span { color: #d9a5a5; overflow-wrap: anywhere; }
      .boot-error button { align-self: flex-start; margin-top: 6px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: #e9f0ff; color: #0a1020; font: inherit; font-weight: 600; cursor: pointer; }
      #boot.failed .boot-meter i { background: #ff7a7a; }
      #boot.failed .boot-log li[data-state="running"] { opacity: 0.45; }
      #boot.failed .boot-log li i, #boot.failed .boot-moon { animation: none; }
      #boot.failed .boot-log { height: auto; max-height: 232px; }
      #boot noscript { margin-top: 18px; color: #ffb4b4; text-align: center; }
      @keyframes boot-pulse { 50% { opacity: 0.35; transform: scale(0.7); } }
      @keyframes boot-orbit { to { transform: rotate(360deg); } }
      @media (max-height: 520px) {
        .boot-mark { width: 56px; height: 56px; border-radius: 13px; }
        .boot-title { margin-top: 10px; font-size: 16px; }
        .boot-meter { margin-top: 16px; }
        .boot-log { margin-top: 12px; height: 108px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-moon, .boot-log li i { animation: none; }
        .boot-meter i, .boot-log li, #boot { transition: none; }
      }
    </style>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <!-- (not id="app": an element's id is a property of window, and window.app is the explorer once it is ready) -->
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="labels"></div>
      <div id="hud"></div>
    </div>
    <div id="boot" role="status">
      <div class="boot-box">
        <svg class="boot-mark" viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <radialGradient id="boot-sky" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#18284a"/><stop offset="1" stop-color="#02040a"/></radialGradient>
            <radialGradient id="boot-world" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#cfe6ff"/><stop offset="0.42" stop-color="#5b97ea"/><stop offset="1" stop-color="#0a1a3c"/></radialGradient>
          </defs>
          <rect width="512" height="512" fill="url(#boot-sky)"/>
          <g fill="#fff"><circle cx="104" cy="118" r="5"/><circle cx="398" cy="104" r="4"/><circle cx="420" cy="388" r="3.5"/><circle cx="92" cy="396" r="3"/><circle cx="318" cy="72" r="2.5"/><circle cx="170" cy="438" r="2.5"/></g>
          <g transform="rotate(-22 256 262)" fill="none" stroke="#a9ccff" stroke-width="11" stroke-linecap="round">
            <path d="M82 262A174 54 0 0 1 430 262" opacity="0.55"/>
            <circle cx="256" cy="262" r="98" fill="url(#boot-world)" stroke="none"/>
            <path d="M82 262A174 54 0 0 0 430 262"/>
          </g>
          <circle class="boot-moon" cx="256" cy="56" r="13" fill="#e8f1ff"/>
        </svg>
        <div class="boot-title">STARFARER</div>
        <div class="boot-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        <div class="boot-row"><span class="boot-received">Starting</span><span class="boot-percent">0 %</span></div>
        <ul class="boot-log" aria-live="polite"></ul>
        <noscript>This app needs JavaScript and WebGL 2.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
