<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- the page is the app: it fills the screen under the notch and the home bar, and never zooms -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A real-scale universe to explore: 2.75 million real stars, every planet and moon, black holes, galaxies." />
    <!--
      The link's preview in a chat or a post (Open Graph, and X's card). A preview is fetched without
      the part after '#', so every shared scene shows this one. https://dippy34.github.io/starfarer/ is put in by vite.config.ts:
      og:image and og:url must be absolute. The picture is the app's own, captured from it
      (scripts/og-image.mjs), 1200 x 630.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Starfarer" />
    <meta property="og:title" content="Starfarer: the real universe, to scale" />
    <meta property="og:description" content="Every planet and moon where they really are, 2.75 million real stars, black holes and galaxies. Change a world and watch real gravity take over." />
    <meta property="og:url" content="https://dippy34.github.io/starfarer/" />
    <meta property="og:image" content="https://dippy34.github.io/starfarer/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Saturn and its rings, lit by the Sun, as Starfarer draws them" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Starfarer: the real universe, to scale" />
    <meta name="twitter:description" content="Every planet and moon where they really are, 2.75 million real stars, black holes and galaxies. Change a world and watch real gravity take over." />
    <meta name="twitter:image" content="https://dippy34.github.io/starfarer/og-image.png" />
    <meta name="twitter:image:alt" content="Saturn and its rings, lit by the Sun, as Starfarer draws them" />
    <!-- added to a phone's home screen it opens like an app, without the browser around it -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starfarer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Starfarer</title>
    <!--
      The loading screen: styled here, not in the stylesheet, so that it is on the screen with the
      first bytes of the page. src/ui/Splash.ts fills it in from the real loading.
    -->
    <style>html,body{background:#000;height:100%;margin:0}#boot{z-index:100;box-sizing:border-box;padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));color:#e6e6e6;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#000;flex-direction:column;justify-content:center;align-items:center;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;transition:opacity .6s;display:flex;position:fixed;inset:0}#boot.ready{pointer-events:none}#boot.done{opacity:0}.boot-box{flex-direction:column;align-items:center;width:min(100%,344px);display:flex}.boot-title{letter-spacing:.16em;text-indent:.16em;color:#fff;font-size:22px;font-weight:600}.boot-meter{background:#ffffff24;width:100%;height:2px;margin-top:28px;overflow:hidden}.boot-meter i{transform-origin:0;background:#fff;width:100%;height:100%;transition:transform .35s ease-out;display:block;transform:scaleX(0)}.boot-row{color:#8a8a8a;font-variant-numeric:tabular-nums;justify-content:space-between;width:100%;margin-top:9px;font-size:12px;display:flex}.boot-log{text-align:center;width:100%;height:44px;margin:18px 0 0;padding:0;font-size:13px;list-style:none;overflow:hidden}.boot-log li{max-height:22px;overflow:hidden}.boot-log li.old,.boot-log li[data-state=done],.boot-log li i{display:none}.boot-log p{white-space:nowrap;text-overflow:ellipsis;min-width:0;margin:0;overflow:hidden}.boot-log b{color:#cfcfcf;font-weight:400}.boot-log span{color:#7d7d7d}.boot-log span:not(:empty):before{content:" · "}.boot-log li[data-state=failed] b{color:#ff9a9a}.boot-error{box-sizing:border-box;background:#3c0e128c;border:1px solid #ff7a7a59;border-radius:14px;flex-direction:column;gap:6px;width:100%;margin-top:4px;padding:14px 16px;font-size:13px;display:flex}.boot-error b{color:#ffd7d7;font-weight:600}.boot-error span{color:#d9a5a5;overflow-wrap:anywhere}.boot-error button{color:#000;min-height:44px;font:inherit;cursor:pointer;background:#fff;border:0;border-radius:8px;align-self:flex-start;margin-top:6px;padding:0 20px;font-weight:600}#boot.failed .boot-meter i{background:#ff7a7a}#boot.failed .boot-log li[data-state=running]{opacity:.45}#boot.failed .boot-log{text-align:left;height:auto;max-height:232px}#boot.failed .boot-log li[data-state=done]{display:block}#boot noscript{color:#ffb4b4;text-align:center;margin-top:18px}@media (max-height:520px){.boot-title{font-size:18px}.boot-meter{margin-top:16px}.boot-log{margin-top:12px}}@media (prefers-reduced-motion:reduce){.boot-meter i,#boot{transition:none}}</style>
    <script type="module" crossorigin src="./assets/index-B3rwsBB0.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Ccgwrn9v.css">
  </head>
  <body>
    <!-- (not id="app": an element's id is a property of window, and window.app is the explorer once it is ready) -->
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="labels"></div>
      <div id="hud"></div>
    </div>
    <div id="boot" role="status">
      <div class="boot-box">
        <div class="boot-title">STARFARER</div>
        <div class="boot-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        <div class="boot-row"><span class="boot-received">Starting</span><span class="boot-percent">0 %</span></div>
        <ul class="boot-log" aria-live="polite"></ul>
        <noscript>This app needs JavaScript and WebGL 2.</noscript>
      </div>
    </div>
  </body>
</html>
