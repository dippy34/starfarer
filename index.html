<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- the page is the app: it fills the screen under the notch and the home bar, and never zooms -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A real-scale universe to explore: 2.75 million real stars, every planet and moon, black holes, galaxies." />
    <!-- added to a phone's home screen it opens like an app, without the browser around it -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starfarer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Starfarer</title>
    <!--
      The loading screen: styled here, not in the stylesheet, so that it is on the screen with the
      first bytes of the page. src/ui/Splash.ts fills it in from the real loading.
    -->
    <style>html,body{background:#000;height:100%;margin:0}#boot{z-index:100;box-sizing:border-box;padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));color:#dfe7f8;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:radial-gradient(120% 70% at 50% 26%,#101b38 0%,#04070f 60%,#000 100%);flex-direction:column;justify-content:center;align-items:center;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;transition:opacity .6s;display:flex;position:fixed;inset:0}#boot.ready{pointer-events:none}#boot.done{opacity:0}.boot-box{flex-direction:column;align-items:center;width:min(100%,344px);display:flex}.boot-mark{border-radius:21px;width:92px;height:92px;box-shadow:0 12px 44px #407cff47,0 0 0 1px #aacdff1f}.boot-moon{transform-origin:256px 262px;animation:9s linear infinite boot-orbit}.boot-title{letter-spacing:.34em;text-indent:.34em;color:#fff;margin-top:18px;font-size:20px;font-weight:300}.boot-meter{background:#ffffff1f;border-radius:2px;width:100%;height:4px;margin-top:30px;overflow:hidden}.boot-meter i{transform-origin:0;background:linear-gradient(90deg,#4f8de6,#cfe6ff);border-radius:2px;width:100%;height:100%;transition:transform .35s ease-out;display:block;transform:scaleX(0)}.boot-row{color:#8494b3;font-variant-numeric:tabular-nums;justify-content:space-between;width:100%;margin-top:9px;font-size:12px;display:flex}.boot-log{width:100%;height:232px;margin:20px 0 0;padding:0;font-size:13px;list-style:none;overflow:hidden}.boot-log li{grid-template-columns:14px 1fr;column-gap:9px;max-height:44px;padding-bottom:7px;transition:max-height .3s,opacity .3s,padding .3s;display:grid;overflow:hidden}.boot-log li.old{opacity:0;max-height:0;padding-bottom:0}.boot-log li i{background:#7fb2ff;border-radius:50%;justify-self:center;width:6px;height:6px;margin-top:6px;animation:1.1s ease-in-out infinite boot-pulse}.boot-log li[data-state=done] i{background:0 0;border-bottom:1.6px solid #63cf9c;border-left:1.6px solid #63cf9c;border-radius:0;width:8px;height:4px;margin-top:5px;animation:none;transform:rotate(-45deg)}.boot-log li[data-state=failed] i{background:#ff7a7a;animation:none}.boot-log p{min-width:0;margin:0}.boot-log b{color:#eef3ff;font-weight:500}.boot-log li[data-state=done] b{color:#aebbd6;font-weight:400}.boot-log span{color:#7888a8}.boot-log span:not(:empty):before{content:" · "}.boot-error{box-sizing:border-box;background:#3c0e128c;border:1px solid #ff7a7a59;border-radius:14px;flex-direction:column;gap:6px;width:100%;margin-top:4px;padding:14px 16px;font-size:13px;display:flex}.boot-error b{color:#ffd7d7;font-weight:600}.boot-error span{color:#d9a5a5;overflow-wrap:anywhere}.boot-error button{color:#0a1020;min-height:44px;font:inherit;cursor:pointer;background:#e9f0ff;border:0;border-radius:22px;align-self:flex-start;margin-top:6px;padding:0 20px;font-weight:600}#boot.failed .boot-meter i{background:#ff7a7a}#boot.failed .boot-log li[data-state=running]{opacity:.45}#boot.failed .boot-log li i,#boot.failed .boot-moon{animation:none}#boot.failed .boot-log{height:auto;max-height:232px}#boot noscript{color:#ffb4b4;text-align:center;margin-top:18px}@keyframes boot-pulse{50%{opacity:.35;transform:scale(.7)}}@keyframes boot-orbit{to{transform:rotate(360deg)}}@media (max-height:520px){.boot-mark{border-radius:13px;width:56px;height:56px}.boot-title{margin-top:10px;font-size:16px}.boot-meter{margin-top:16px}.boot-log{height:108px;margin-top:12px}}@media (prefers-reduced-motion:reduce){.boot-moon,.boot-log li i{animation:none}.boot-meter i,.boot-log li,#boot{transition:none}}</style>
    <script type="module" crossorigin src="./assets/index-D0sytlgg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BUS23DEH.css">
  </head>
  <body>
    <!-- (not id="app": an element's id is a property of window, and window.app is the explorer once it is ready) -->
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="labels"></div>
      <div id="hud"></div>
    </div>
    <div id="boot" role="status">
      <div class="boot-box">
        <svg class="boot-mark" viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <radialGradient id="boot-sky" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#18284a"/><stop offset="1" stop-color="#02040a"/></radialGradient>
            <radialGradient id="boot-world" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#cfe6ff"/><stop offset="0.42" stop-color="#5b97ea"/><stop offset="1" stop-color="#0a1a3c"/></radialGradient>
          </defs>
          <rect width="512" height="512" fill="url(#boot-sky)"/>
          <g fill="#fff"><circle cx="104" cy="118" r="5"/><circle cx="398" cy="104" r="4"/><circle cx="420" cy="388" r="3.5"/><circle cx="92" cy="396" r="3"/><circle cx="318" cy="72" r="2.5"/><circle cx="170" cy="438" r="2.5"/></g>
          <g transform="rotate(-22 256 262)" fill="none" stroke="#a9ccff" stroke-width="11" stroke-linecap="round">
            <path d="M82 262A174 54 0 0 1 430 262" opacity="0.55"/>
            <circle cx="256" cy="262" r="98" fill="url(#boot-world)" stroke="none"/>
            <path d="M82 262A174 54 0 0 0 430 262"/>
          </g>
          <circle class="boot-moon" cx="256" cy="56" r="13" fill="#e8f1ff"/>
        </svg>
        <div class="boot-title">STARFARER</div>
        <div class="boot-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        <div class="boot-row"><span class="boot-received">Starting</span><span class="boot-percent">0 %</span></div>
        <ul class="boot-log" aria-live="polite"></ul>
        <noscript>This app needs JavaScript and WebGL 2.</noscript>
      </div>
    </div>
  </body>
</html>
