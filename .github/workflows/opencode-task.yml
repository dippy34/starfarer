# One outside-AI run for one task on TASKS.md, started by hand.
#
# Who starts it: Claude, by saving a start note, .github/opencode/start/<task>.txt, on the live branch
# (the owner asked for that, 25 Nov 2026: "I want you to do everything"); every start is a commit in the
# history. A note's text goes to the AI as the reviewer's notes on its last try (none on a first try),
# a line "model: opencode-go/..." picks its model, and lines starting # are for the history only. A push that adds or changes notes starts one run for each (at most 5, 3 at a time).
# The owner can still start one from GitHub's Actions tab: "OpenCode task", then "Run workflow", then
# the task name (the part after task/ in TASKS.md, e.g. everest-summit). "smoke-test" only checks that
# sign-in and the model work, and changes nothing.
#
# What it can touch: nothing outside this run. The repository is checked out read-only
# (contents: read, and no git credentials are kept), so the AI's edits stay on this runner. They
# come back as an artifact: result.patch (every change), REPORT.md (the AI's own report),
# check.log (npm run check) and opencode.log. Claude reviews and tests them, and only Claude puts
# work live (TASKS.md, "How a task is finished").
#
# Sign-in: keyless. GitHub vouches for the repository and branch (OIDC). The OpenCode service
# account trusts only workflows of dippy34/starfarer on claude/friendly-hypatia-up418z, and the
# repository secret OPENCODE_CLIENT_ID names that account. Usage counts against the owner's
# OpenCode Go Plus plan.
name: OpenCode task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task name from TASKS.md, e.g. everest-summit (smoke-test: a quick sign-in check)"
        required: true
        type: string
      notes:
        description: "Claude's review notes, for a second try (optional)"
        required: false
        type: string
        default: ""
      model:
        description: "OpenCode Go model (leave empty: the model TASKS.md names for the task)"
        required: false
        type: string
        default: ""
  push:
    branches: [claude/friendly-hypatia-up418z]
    paths: ['.github/opencode/start/**']

permissions:
  id-token: write
  contents: read

# (one at a time per task started by hand; each push of start notes is its own group, so none is dropped)
concurrency:
  group: opencode-task-${{ inputs.task || github.sha }}
  cancel-in-progress: false

env:
  # the browser the browser suites use: the same Chrome for Testing as browser-tests.yml (keep the two equal)
  CHROME_VERSION: 153.0.8010.12

jobs:
  # which tasks to run: the one started by hand, or one for each start note this push added or changed
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.pick.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/opencode
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          TASK_INPUT: ${{ inputs.task }}
          NOTES_INPUT: ${{ inputs.notes }}
          MODEL_INPUT: ${{ inputs.model }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            jq -cn --arg t "$TASK_INPUT" --arg n "$NOTES_INPUT" --arg m "$MODEL_INPUT" '[{task: $t, notes: $n, model: $m}]' > tasks.json
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              files=$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$AFTER" -- .github/opencode/start/)
            else
              files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- .github/opencode/start/)
            fi
            echo '[]' > tasks.json
            n=0
            for f in $files; do
              case "$f" in *.txt) ;; *) continue ;; esac
              name=$(basename "$f" .txt)
              if ! printf '%s' "$name" | grep -Eq '^[a-z0-9][a-z0-9-]{0,48}$'; then echo "Not a task name: $f"; continue; fi
              model=$(grep -m1 -oE '^model: *opencode-go/[A-Za-z0-9._-]+' "$f" | sed 's/^model: *//' || true)
              # (lines starting # are for the history only, such as when it was started)
              notes=$(grep -v -e '^model:' -e '^#' "$f" | head -c 4000 || true)
              jq -c --arg t "$name" --arg n "$notes" --arg m "$model" '. + [{task: $t, notes: $n, model: $m}]' tasks.json > next.json
              mv next.json tasks.json
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then echo "At most 5 runs a push: the rest wait for the next."; break; fi
            done
          fi
          echo "tasks=$(cat tasks.json)" >> "$GITHUB_OUTPUT"
          jq . tasks.json

  task:
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      TASK: ${{ matrix.task }}
      NOTES: ${{ matrix.notes }}
      MODEL_INPUT: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the task name
        run: |
          if ! printf '%s' "$TASK" | grep -Eq '^[a-z0-9][a-z0-9-]{0,48}$'; then
            echo "A task name is lower-case letters, digits and hyphens, e.g. everest-summit."; exit 1
          fi
          if [ "$TASK" != "smoke-test" ] && ! grep -qF "### \`task/$TASK\`" TASKS.md; then
            echo "There is no section for task/$TASK in TASKS.md."; exit 1
          fi
          # the model: as given, else the one the task's section names, else the senior
          MODEL="$MODEL_INPUT"
          if [ -z "$MODEL" ] && [ "$TASK" != "smoke-test" ]; then
            MODEL=$(awk -v h="### \`task/$TASK\`" 'index($0, h) == 1 { f = 1; next } f && /^### / { f = 0 } f' TASKS.md \
              | grep -o 'opencode-go/[A-Za-z0-9._-]*' | head -1)
          fi
          MODEL="${MODEL:-opencode-go/kimi-k3.1-pro}"
          if ! printf '%s' "$MODEL" | grep -Eq '^opencode-go/[A-Za-z0-9._-]+$'; then
            echo "The model must be an OpenCode Go model, e.g. opencode-go/kimi-k3.1-pro."; exit 1
          fi
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "Model: $MODEL"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A browser, so that the AI can run the browser suites (scripts/*.mjs) and look at its own work: as
      # browser-tests.yml has it, the same Chrome for Testing and fonts as the agents' container, so that
      # text, layouts and taps come out as they do in Claude's checks.
      - run: npx playwright install-deps chromium
      - name: Fonts as in the container
        run: |
          sudo apt-get install -y --no-install-recommends fonts-inter fonts-jetbrains-mono fonts-crosextra-caladea fonts-crosextra-carlito
          sudo tee /etc/fonts/conf.d/56-prefer-inter.conf > /dev/null <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>ui-sans-serif</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f > /dev/null
      - uses: actions/cache@v4
        id: chrome
        with:
          path: ~/chrome-for-testing
          key: chrome-for-testing-${{ env.CHROME_VERSION }}
      - if: steps.chrome.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/chrome-for-testing && cd ~/chrome-for-testing
          curl -sSfLo chrome.zip "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          unzip -q chrome.zip && rm chrome.zip
      - run: |
          echo "CHROMIUM_PATH=$HOME/chrome-for-testing/chrome-linux64/chrome" >> "$GITHUB_ENV"
          "$HOME/chrome-for-testing/chrome-linux64/chrome" --version

      # (OpenCode's own snippet, with the account's id read from the repository secret; an earlier
      # message asked for the name OPENCODE_API_KEY, so that name is accepted too)
      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
          CLIENT_ID: ${{ secrets.OPENCODE_CLIENT_ID || secrets.OPENCODE_API_KEY }}
          HAS_CLIENT_ID: ${{ secrets.OPENCODE_CLIENT_ID != '' }}
          HAS_API_KEY: ${{ secrets.OPENCODE_API_KEY != '' }}
        run: |
          echo "repository secrets set: OPENCODE_CLIENT_ID $HAS_CLIENT_ID, OPENCODE_API_KEY $HAS_API_KEY"
          if [ -z "$CLIENT_ID" ]; then
            echo "Neither repository secret OPENCODE_CLIENT_ID nor OPENCODE_API_KEY is set (Settings, Secrets and variables, Actions, Repository secrets)."; exit 1
          fi
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id="$CLIENT_ID" \
            -d subject_token="$oidc" | jq -r .access_token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then echo "OpenCode did not sign this run in."; exit 1; fi
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai@1.19.5
          mkdir -p ~/.config/opencode
          # The Go provider takes the signed-in key from the environment. The run's model (--model)
          # is the senior; "junior" is a cheap, fast subagent it hands small pieces to
          # (picks from the model research of 25 Nov 2026, in TASKS.md). Every permission is set, so
          # that nothing asks: here nobody can answer, and a question left unanswered ends the run (the
          # first ship-instruments run stopped after 3 minutes, asking to read a folder outside the
          # repository). Folders outside it are refused, and so is the web.
          cat > ~/.config/opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": { "opencode-go": { "options": { "apiKey": "{env:OPENCODE_API_KEY}" } } },
            "permission": { "edit": "allow", "bash": "allow", "webfetch": "deny", "external_directory": "deny" },
            "agent": {
              "junior": {
                "description": "Cheap, fast worker for small, well-specified pieces: one function, one test, one CSS block, boilerplate or a small fix",
                "mode": "subagent",
                "model": "opencode-go/glm-5.3-flash",
                "prompt": "You write small, focused changes exactly as asked. Follow the rules in TASKS.md and the code's existing style. Never invent data. Don't refactor unrelated code. List the files you changed."
              }
            }
          }
          JSON
          opencode --version

      - name: Run the task
        run: |
          if [ "$TASK" = "smoke-test" ]; then
            prompt="Reply with one line: 'Signed in, and the model works.' Do not read, change or create any files."
          else
            prompt="You are an AI developer working on Starfarer, in a working copy of its repository on a GitHub Actions runner. First read TASKS.md. Then do ONLY the task in the section headed task/$TASK, following every rule in TASKS.md, with these differences for this run: do not create branches, commit or push (this copy is read-only); just change the files here. Hand small, well-specified pieces (one function, one test, one CSS block) to the junior subagent, and review what it returns before you keep it; do the harder parts yourself. A browser is installed for the browser suites in scripts/*.mjs (docs/notes/testing.md): build with npx vite build, serve the build with npx vite preview --port 4173 --strictPort --host 127.0.0.1 in the background, then run node scripts/<suite>.mjs http://127.0.0.1:4173/ <a folder> with the part your task touches (scripts/affected.mjs lists the parts). Run only the suites and parts your change touches, since a whole suite can take 30 minutes here, and run each one on the code before your change too when the task asks for a check that fails before it. Put every picture you take, before and after, in out/pictures (inside the repository; git ignores out/), which comes back with the run. Work only inside the repository folder: anything outside it is refused. Before you finish, run npm run check and fix what fails. Finally write your report to REPORT.md in the repository root: what you changed, how you checked it (each suite and part you ran, with its counts), and what is left."
            if [ -n "$NOTES" ]; then
              prompt="$prompt Notes from the reviewer (Claude) on the previous try: $NOTES"
            fi
          fi
          mkdir -p "$OUT/pictures" out/pictures
          # (the OIDC request variables stay with the sign-in step, not with the AI)
          set +e
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            timeout 110m opencode run --model "$MODEL" "$prompt" 2>&1 | tee "$OUT/opencode.log"
          echo "opencode exit ${PIPESTATUS[0]}" | tee -a "$OUT/opencode.log"

      - name: Collect the result
        if: always()
        run: |
          OUT="${OUT:-$RUNNER_TEMP/out}"
          mkdir -p "$OUT"
          if [ "$TASK" != "smoke-test" ]; then
            set +e
            npm run check > "$OUT/check.log" 2>&1
            echo "npm run check exit $?" >> "$OUT/check.log"
            set -e
          fi
          if [ -d out/pictures ]; then cp -r out/pictures/. "$OUT/pictures/" 2>/dev/null || true; fi
          git add -A
          git diff --cached --stat > "$OUT/changed-files.txt"
          git diff --cached > "$OUT/result.patch"
          if [ -f REPORT.md ]; then cp REPORT.md "$OUT/REPORT.md"; fi
          {
            echo "## OpenCode task: $TASK"
            echo "Model: \`$MODEL\`"
            echo
            echo "Changed files:"
            echo '```'
            cat "$OUT/changed-files.txt"
            echo '```'
            if [ -f "$OUT/check.log" ]; then echo "$(tail -1 "$OUT/check.log")"; fi
            echo
            echo "Next: Claude reviews it. Nothing here is live until then."
          } >> "$GITHUB_STEP_SUMMARY"
          # a run that changed nothing did not do its task: it shows as failed, not as work to review
          if [ "$TASK" != "smoke-test" ] && [ ! -s "$OUT/result.patch" ]; then
            echo "::error::The AI changed no file (see opencode.log in the run's files)."; exit 1
          fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.task }}-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: warn
