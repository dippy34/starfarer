# Builds Starfarer and publishes the static site (dist/) to the gh-pages branch,
# which GitHub Pages serves at https://<owner>.github.io/<repository>/.
#
# One-time repository setting (GitHub does not let a workflow switch it on):
#   Settings → Pages → Build and deployment → Source: "Deploy from a branch",
#   Branch: "gh-pages", folder "/ (root)".
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/friendly-hypatia-up418z
  workflow_dispatch:

# The job pushes the built site to the gh-pages branch.
permissions:
  contents: write

# A newer push replaces a deployment that is still running.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck, unit tests and the production build: a broken commit is never published.
      - run: npm run check

      - name: Publish dist/ to the gh-pages branch
        run: |
          # Without this file GitHub Pages runs every one of the ~10,000 files through Jekyll.
          touch dist/.nojekyll
          # The site is 0.9 GB, nearly all of it data that is already in this repository. The new
          # gh-pages commit is therefore written into this clone's object store: git then uploads
          # only what the server does not have (the fresh bundles), not the data again.
          parent=""
          if git fetch --quiet --depth=1 origin gh-pages; then parent="$(git rev-parse FETCH_HEAD)"; fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/pages-index"
          git --work-tree=dist add --all --force
          tree="$(git write-tree)"
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "The published site is already up to date."
            exit 0
          fi
          commit="$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" ${parent:+-p "$parent"} -m "Deploy ${GITHUB_SHA}")"
          git push --quiet origin "$commit:refs/heads/gh-pages"
