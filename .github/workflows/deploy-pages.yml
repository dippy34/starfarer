# Builds Starfarer and publishes the static site (dist/) to the gh-pages branch,
# which GitHub Pages serves at https://<owner>.github.io/<repository>/.
#
# One-time repository setting (GitHub does not let a workflow switch it on):
#   Settings → Pages → Build and deployment → Source: "Deploy from a branch",
#   Branch: "gh-pages", folder "/ (root)".
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/friendly-hypatia-up418z
  workflow_dispatch:

# The job pushes the built site to the gh-pages branch.
permissions:
  contents: write

# A newer push replaces a deployment that is still running.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck, lint, unit tests and the production build: a broken commit is never published.
      - run: npm run check

      - name: Publish dist/ to the gh-pages branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without this file GitHub Pages runs every one of the ~8,700 files through Jekyll.
          touch .nojekyll
          git init --quiet --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Deploy ${GITHUB_SHA}"
          # A single commit, replaced on every deployment: the branch never accumulates history.
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
